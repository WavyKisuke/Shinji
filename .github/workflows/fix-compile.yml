name: Fix LibraryView iOS 16 compatibility

on:
  push:
    paths:
      - '.github/workflows/fix-compile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-black-screen
          fetch-depth: 0
      - name: Patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Shinji/Views/LibraryView.swift')
          s = p.read_text()
          s = s.replace('\n        .scrollClipDisabled()', '')
          s = s.replace('.onChange(of: shelfPositions[title] ?? 0) { _, newValue in', '.onChange(of: shelfPositions[title] ?? 0) { newValue in')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Shinji/Views/LibraryView.swift
          git rm .github/workflows/fix-compile.yml
          git commit -m "Fix LibraryView iOS 16 compatibility"
          git push origin HEAD:fix/player-black-screen
