name: Trigger patched build

on:
  push:
    paths:
      - '.github/workflows/trigger-build.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-black-screen
          fetch-depth: 0
      - name: Remove trigger workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/trigger-build.yml
          git commit -m "Remove temporary build trigger"
          git push origin HEAD:fix/player-black-screen
