name: Build unsigned IPA

on:
  push:
    branches: [main, master, feature/player-fullscreen-audio-track, fix/player-black-screen]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Repair known Swift source issues
        run: python3 Scripts/fix_build_source.py

      - name: Remove obsolete Home watchlist block
        run: python3 Scripts/fix_home_watchlist.py

      - name: Repair player controls
        run: python3 Scripts/fix_player_controls.py

      - name: Fix floating tab bar covering player controls
        run: python3 Scripts/fix_player_tabbar.py

      - name: Polish player fullscreen and seek gestures
        run: python3 Scripts/fix_player_polish.py

      - name: Fix player control hit testing and MPV commands
        run: python3 Scripts/fix_player_hit_testing.py

      - name: Apply final Nuvio player implementation
        run: python3 Scripts/fix_nuvio_player.py

      - name: Finalize Nuvio MPV track commands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ["Shinji/Views/PlayerView.swift", "Shinji/Views/MPVPlayerSurface.swift"]:
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              text = text.replace('["cycle", "audio"]', '["cycle", "aid"]')
              text = text.replace('["cycle", "sub"]', '["cycle", "sid"]')
              p.write_text(text, encoding="utf-8")
          PY

      - name: Ensure MPV track bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Shinji/Views/MPVPlayerSurface.swift")
          m = p.read_text(encoding="utf-8")

          if "var onTracks: ([MPVPlayerTrack]) -> Void" not in m:
              m = m.replace(
                  "    var onPlaybackUpdate: (Double, Double, Bool) -> Void = { _, _, _ in }\n",
                  "    var onPlaybackUpdate: (Double, Double, Bool) -> Void = { _, _, _ in }\n    var onTracks: ([MPVPlayerTrack]) -> Void = { _ in }\n",
                  1,
              )
              m = m.replace(
                  "        player.onPlaybackUpdate = onPlaybackUpdate\n        context.coordinator.player = player",
                  "        player.onPlaybackUpdate = onPlaybackUpdate\n        player.onTracks = onTracks\n        context.coordinator.player = player",
                  1,
              )
              m = m.replace(
                  "        player.onPlaybackUpdate = onPlaybackUpdate\n        player.setMuted(muted)",
                  "        player.onPlaybackUpdate = onPlaybackUpdate\n        player.onTracks = onTracks\n        player.setMuted(muted)",
                  1,
              )
              m = m.replace(
                  "    var onPlaybackUpdate: ((Double, Double, Bool) -> Void)?\n",
                  "    var onPlaybackUpdate: ((Double, Double, Bool) -> Void)?\n    var onTracks: (([MPVPlayerTrack]) -> Void)?\n",
                  1,
              )

          if "struct MPVPlayerTrack: Identifiable" not in m:
              model = '''struct MPVPlayerTrack: Identifiable, Hashable {
    let id: Int
    let title: String
    let language: String?
    let type: String
    let isSelected: Bool
}

'''
              m = m.replace("struct MPVPlayerSurface: UIViewControllerRepresentable {", model + "struct MPVPlayerSurface: UIViewControllerRepresentable {", 1)

          if "private func publishTracks(_ handle: OpaquePointer)" not in m:
              methods = '''    private func publishTracks(_ handle: OpaquePointer) {
        var count: Int64 = 0
        guard mpv_get_property(handle, "track-list/count", MPV_FORMAT_INT64, &count) >= 0 else { return }
        var tracks: [MPVPlayerTrack] = []
        for index in 0..<max(0, Int(count)) {
            let prefix = "track-list/\\(index)"
            guard let type = stringProperty(handle, "\\(prefix)/type"), type == "audio" || type == "sub" else { continue }
            let id = intProperty(handle, "\\(prefix)/id") ?? (index + 1)
            let title = stringProperty(handle, "\\(prefix)/title") ?? ""
            let language = stringProperty(handle, "\\(prefix)/lang")
            let selected = intProperty(handle, type == "audio" ? "aid" : "sid") == id
            tracks.append(MPVPlayerTrack(id: id, title: title, language: language, type: type, isSelected: selected))
        }
        DispatchQueue.main.async { [weak self] in self?.onTracks?(tracks) }
    }

    private func stringProperty(_ handle: OpaquePointer, _ name: String) -> String? {
        var value: UnsafeMutablePointer<CChar>?
        guard mpv_get_property(handle, name, MPV_FORMAT_STRING, &value) >= 0, let value else { return nil }
        defer { mpv_free(value) }
        return String(cString: value)
    }

    private func intProperty(_ handle: OpaquePointer, _ name: String) -> Int? {
        var value: Int64 = 0
        guard mpv_get_property(handle, name, MPV_FORMAT_INT64, &value) >= 0 else { return nil }
        return Int(value)
    }

'''
              m = m.replace("    private func publishPlaybackState(_ handle: OpaquePointer) {", methods + "    private func publishPlaybackState(_ handle: OpaquePointer) {", 1)

          m = m.replace(
              '                    self.publishStatus("Stream loaded")\n                    self.publishPlaybackState(handle)',
              '                    self.publishStatus("Stream loaded")\n                    self.publishTracks(handle)\n                    self.publishPlaybackState(handle)',
              1,
          )
          m = m.replace(
              '                case MPV_EVENT_PROPERTY_CHANGE:\n                    self.publishPlaybackState(handle)',
              '                case MPV_EVENT_PROPERTY_CHANGE:\n                    self.publishTracks(handle)\n                    self.publishPlaybackState(handle)',
              1,
          )
          p.write_text(m, encoding="utf-8")
          PY

      - name: Ensure catalog metadata model
        run: python3 Scripts/fix_catalog_metadata.py

      - name: Repair Featured Picks page
        run: python3 Scripts/fix_featured_page.py

      - name: Add Keep Watching poster support
        run: python3 Scripts/poster_upgrade.py

      - name: Build app for device without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project Shinji.xcodeproj \
            -scheme Shinji \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Shinji.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/Shinji.app"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Shinji-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Shinji-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Shinji-unsigned-ipa
          path: Shinji-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
