name: Patch library navigation and filters

on:
  push:
    paths:
      - '.github/workflows/app-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-black-screen
          fetch-depth: 0
      - name: Patch LibraryView
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('Shinji/Views/LibraryView.swift')
          text = path.read_text()

          text = text.replace(
              '@State private var selectedGenre = "All Genres"',
              '@State private var selectedGenres: Set<String> = []\n    @State private var shelfPositions: [String: Int] = [:]'
          )

          old_genre = '''        if selectedGenre != "All Genres" {\n            result = result.filter { item in\n                let description = addonStore.catalogItems.first(where: { $0.id == item.id })?.description ?? ""\n                return (item.title + " " + description).localizedCaseInsensitiveContains(selectedGenre)\n            }\n        }'''
          new_genre = '''        if !selectedGenres.isEmpty {\n            result = result.filter { item in\n                let description = addonStore.catalogItems.first(where: { $0.id == item.id })?.description ?? ""\n                let searchableText = item.title + " " + description\n                return selectedGenres.contains { genre in\n                    searchableText.localizedCaseInsensitiveContains(genre)\n                }\n            }\n        }'''
          if old_genre not in text:
              raise SystemExit('selected genre filtering block not found')
          text = text.replace(old_genre, new_genre)

          filter_re = re.compile(r'    private var filterBar: some View \{.*?\n    private var contentSection: some View \{', re.S)
          filter_new = '''    private var filterBar: some View {\n        let genreOptions = ["Action", "Adventure", "Animation", "Comedy", "Crime", "Documentary", "Drama", "Fantasy", "Horror", "Romance", "Sci-Fi", "Thriller"]\n        return ScrollView(.horizontal, showsIndicators: false) {\n            HStack(spacing: 9) {\n                Button {\n                    selectedGenres.removeAll()\n                } label: {\n                    Text("All Genres")\n                        .font(.system(size: 12, weight: .semibold))\n                        .foregroundStyle(selectedGenres.isEmpty ? .white : .white.opacity(0.62))\n                        .padding(.horizontal, 14)\n                        .padding(.vertical, 9)\n                        .background(selectedGenres.isEmpty ? Color(hex: accentHex) : Color.white.opacity(0.07), in: Capsule())\n                }\n                .buttonStyle(.plain)\n\n                ForEach(genreOptions, id: \\.self) { genre in\n                    let selected = selectedGenres.contains(genre)\n                    Button {\n                        if selected {\n                            selectedGenres.remove(genre)\n                        } else {\n                            selectedGenres.insert(genre)\n                        }\n                    } label: {\n                        HStack(spacing: 5) {\n                            if selected { Image(systemName: "checkmark") }\n                            Text(genre)\n                        }\n                        .font(.system(size: 12, weight: .semibold))\n                        .foregroundStyle(selected ? .white : .white.opacity(0.7))\n                        .padding(.horizontal, 13)\n                        .padding(.vertical, 9)\n                        .background(selected ? Color(hex: accentHex) : Color.white.opacity(0.07), in: Capsule())\n                        .overlay(Capsule().stroke(selected ? Color(hex: accentHex).opacity(0.8) : Color.white.opacity(0.08), lineWidth: 1))\n                    }\n                    .buttonStyle(.plain)\n                }\n            }\n            .padding(.horizontal, 18)\n        }\n        .scrollClipDisabled()\n    }\n\n    private var contentSection: some View {'''
          text, count = filter_re.subn(filter_new, text, count=1)
          if count != 1:
              raise SystemExit('filterBar block not found')

          shelf_re = re.compile(r'    private var catalogShelves: some View \{.*?\n    @ViewBuilder\n    private func shelfSection', re.S)
          shelf_new = '''    private var catalogShelves: some View {\n        VStack(alignment: .leading, spacing: 26) {\n            if kind == .movies {\n                shelfSection("Recently Added Movies", items: Array(addonStore.catalogItems.filter { $0.type == "movie" }.reversed()))\n                shelfSection("Recently Added Shows", items: Array(addonStore.catalogItems.filter { $0.type == "series" }.reversed()))\n                shelfSection("More Movies", items: Array(addonStore.catalogItems.filter { $0.type == "movie" }))\n            } else if kind == .shows {\n                shelfSection("Recently Added Shows", items: Array(addonStore.catalogItems.filter { $0.type == "series" }.reversed()))\n                shelfSection("More Shows", items: Array(addonStore.catalogItems.filter { $0.type == "series" }))\n            } else {\n                shelfSection("Live Channels", items: Array(addonStore.catalogItems.filter { ["channel", "tv", "live"].contains($0.type.lowercased()) }))\n            }\n        }\n    }\n\n    @ViewBuilder\n    private func shelfSection'''
          text, count = shelf_re.subn(shelf_new, text, count=1)
          if count != 1:
              raise SystemExit('catalogShelves block not found')

          section_re = re.compile(r'    @ViewBuilder\n    private func shelfSection\(_ title: String, items: \[AddonCatalogItem\]\) -> some View \{.*?\n    private var footerNote: some View \{', re.S)
          section_new = '''    @ViewBuilder\n    private func shelfSection(_ title: String, items: [AddonCatalogItem]) -> some View {\n        if !items.isEmpty {\n            VStack(alignment: .leading, spacing: 12) {\n                HStack {\n                    Text(title)\n                        .font(.system(size: 18, weight: .bold, design: .rounded))\n                        .foregroundStyle(.white)\n                    Spacer()\n                    let position = shelfPositions[title] ?? 0\n                    Button {\n                        let step = 3\n                        let next = position + step >= items.count ? 0 : position + step\n                        shelfPositions[title] = next\n                    } label: {\n                        Image(systemName: "chevron.right")\n                            .font(.system(size: 15, weight: .bold))\n                            .foregroundStyle(.white.opacity(0.72))\n                            .frame(width: 38, height: 38)\n                            .background(Color.white.opacity(0.07), in: Circle())\n                    }\n                    .buttonStyle(.plain)\n                }\n                .padding(.horizontal, 20)\n\n                ScrollViewReader { proxy in\n                    ScrollView(.horizontal, showsIndicators: false) {\n                        HStack(alignment: .top, spacing: 13) {\n                            ForEach(Array(items.enumerated()), id: \\.offset) { index, item in\n                                Button {\n                                    selectedItem = item\n                                } label: {\n                                    VStack(alignment: .leading, spacing: 8) {\n                                        ZStack {\n                                            RoundedRectangle(cornerRadius: 18, style: .continuous)\n                                                .fill(Color.white.opacity(0.07))\n                                            if let url = item.posterURL {\n                                                AsyncImage(url: url) { phase in\n                                                    switch phase {\n                                                    case .success(let image):\n                                                        image.resizable().scaledToFill()\n                                                    default:\n                                                        Image(systemName: kind.symbol)\n                                                            .font(.system(size: 28))\n                                                            .foregroundStyle(.white.opacity(0.35))\n                                                    }\n                                                }\n                                            } else {\n                                                Image(systemName: kind.symbol)\n                                                    .font(.system(size: 28))\n                                                    .foregroundStyle(.white.opacity(0.35))\n                                            }\n                                        }\n                                        .frame(width: 145, height: 205)\n                                        .clipShape(RoundedRectangle(cornerRadius: 18, style: .continuous))\n\n                                        Text(item.name)\n                                            .font(.system(size: 14, weight: .bold, design: .rounded))\n                                            .foregroundStyle(.white)\n                                            .lineLimit(1)\n                                            .frame(width: 145, alignment: .leading)\n                                        Text(item.addonName)\n                                            .font(.system(size: 12, weight: .medium))\n                                            .foregroundStyle(.white.opacity(0.42))\n                                            .lineLimit(1)\n                                            .frame(width: 145, alignment: .leading)\n                                    }\n                                }\n                                .buttonStyle(.plain)\n                                .id(index)\n                            }\n                        }\n                        .padding(.horizontal, 20)\n                    }\n                    .onChange(of: shelfPositions[title] ?? 0) { _, newValue in\n                        withAnimation(.easeInOut(duration: 0.28)) {\n                            proxy.scrollTo(newValue, anchor: .leading)\n                        }\n                    }\n                }\n            }\n        }\n    }\n\n    private var footerNote: some View {'''
          text, count = section_re.subn(section_new, text, count=1)
          if count != 1:
              raise SystemExit('shelfSection block not found')

          path.write_text(text)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Shinji/Views/LibraryView.swift .github/workflows/app-ui-patch.yml
          git rm .github/workflows/app-ui-patch.yml
          git commit -m "Fix genre multi-select and shelf navigation"
          git push origin HEAD:fix/player-black-screen
